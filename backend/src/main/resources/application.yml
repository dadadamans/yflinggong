server:
  port: 8080

logging:
  level:
    com.oldboss.silverjob: INFO
    com.zaxxer.hikari: INFO

spring:
  application:
    name: silver-job-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/oldboss}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:replace_with_strong_password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    session-expire-hours: 24
  upload:
    health-report-dir: ${HEALTH_REPORT_UPLOAD_DIR:${user.dir}/uploads/healthReports/}
  admin:
    # 强制从环境变量读取，不设置默认值，保证安全性
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    # 辅助信息可以保留非敏感默认值
    nickname: ${ADMIN_NICKNAME:系统管理员}
    real-name: ${ADMIN_REAL_NAME:管理员}
    mobile: ${ADMIN_MOBILE:13600000000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
