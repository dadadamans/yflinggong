version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: silver-job-db
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-oldboss}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-287556}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./backend/sql/docker-init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/docker-init/02-admin.sh:/docker-entrypoint-initdb.d/02-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-oldboss}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - silver-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: silver-job-backend
    ports:
      - "8080:8080"
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME:-oldboss}
      - HEALTH_REPORT_UPLOAD_DIR=/app/uploads/healthReports
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - silver-network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: silver-job-web
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
    networks:
      - silver-network

networks:
  silver-network:
    driver: bridge
